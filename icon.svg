    <path fill="#D1D4D1" d="M331 218c12-15 31-24 55-24 48 0 84 34 84 84 0 53-39 91-96 91-65 0-105-46-105-124 0-95 55-159 139-159 22 0 43 4 59 12v58c-17-9-35-14-57-14-46 0-74 27-79 76zm44 101c24 0 41-16 41-39 0-22-17-38-41-38-23 0-40 16-40 39s17 38 40 38z"/>
  </g>
  <g id="football-detail">
    <circle cx="375" cy="281" r="30" fill="#2A398D"/>
    <polygon points="375,260 394,274 387,296 363,296 356,274" fill="#D1D4D1"/>
    <path d="M375 260v-9M394 274l10-5M387 296l6 10M363 296l-6 10M356 274l-10-5" stroke="#D1D4D1" stroke-width="5" stroke-linecap="round"/>
