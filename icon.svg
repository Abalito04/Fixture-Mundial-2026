<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title>Road To 2026 App Icon</title>
  <desc>Minimal flat app icon for a World Cup 2026 fixture dashboard inspired by trophy, number 26, football and host colors.</desc>
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity=".22"/>
    </filter>
  </defs>
  <g id="background">
    <rect width="512" height="512" rx="96" fill="#101718"/>
    <rect x="28" y="28" width="456" height="456" rx="76" fill="#182123" filter="url(#softShadow)"/>
  </g>
  <g id="trophy-field" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M178 128c-22 12-36 35-36 63 0 48 42 84 78 103v42h72v-42c36-19 78-55 78-103 0-28-14-51-36-63" stroke="#D1D4D1" stroke-width="14"/>
